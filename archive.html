<!DOCTYPE html>
<html lang="ko">
<head>
  <!-- 기본 문서 설정 -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- 브라우저 탭 제목 -->
  <title>지난 시즌 튜닝 | Forza 6 Tuning Archive</title>

  <!-- PWA 설정 -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#101218" />

  <!-- iOS 홈 화면 추가용 기본 설정 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Forza Tunes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <!-- 메인 사이트와 같은 CSS 사용 -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <!-- =========================
       상단 소개 영역
       - 지난 시즌 전용 페이지
  ========================== -->
  <header class="hero">
    <div>
      <p class="eyebrow">SEASON ARCHIVE</p>
      <h1>지난 시즌 튜닝</h1>

      <p class="hero-text">
        이전 페스티벌 시즌 숙제용 튜닝을 주차별로 접어서 보관하는 아카이브입니다.
      </p>

      <a class="archive-link" href="index.html">
        메인 튜닝 아카이브로 돌아가기
      </a>
    </div>
  </header>

  <!-- =========================
       메인 콘텐츠 영역
  ========================== -->
  <main class="container">
    <!-- 지난 시즌 튜닝 목록 -->
    <section class="archive-section">
      <div class="section-header">
        <h2>시즌별 튜닝 기록</h2>
        <p>
          시즌 제목을 누르면 해당 주차의 튜닝 차량 목록이 펼쳐집니다.
        </p>
      </div>

      <!-- archive.js가 이 영역에 시즌별 접이식 목록을 자동으로 넣음 -->
      <div id="archiveList" class="archive-list">
        <div class="weekly-empty">지난 시즌 튜닝 데이터를 불러오는 중입니다...</div>
      </div>
    </section>
  </main>

  <!-- =========================
       차량 상세창 모달
       - 메인 페이지와 같은 구조 사용
  ========================== -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <button id="closeModal" class="close-button" type="button">×</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <!-- 지난 시즌 전용 스크립트 -->
  <script src="archive.js"></script>
</body>
</html>
